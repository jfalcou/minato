[project]
name = "minato"
description = "The meta handler of the jfalcou libraries: their list, and the pins between them."
requires-python = ">=3.12"
version = "0.0.0"
dependencies = ["PyYAML>=6.0"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "D", "UP", "B", "C4", "C90", "SIM", "PERF", "PL", "Q", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.format]
quote-style = "double"
